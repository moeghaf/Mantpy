name: Release

on:
  release:
    types: [published]

# Use "trusted publishing", see https://docs.pypi.org/trusted-publishers/
permissions: {}

jobs:
  release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mantpy
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Build package
        run: uv build
      - name: Publish package distributions to PyPI
        # v1.14.1 bundles twine 6.1.0, which rejects the `Metadata-Version: 2.5`
        # that hatchling >=1.30 emits — that is what failed the v1.0.0 publish.
        # PyPI itself accepts 2.5; v1.14.2 bundles twine 7.0.0.
        #
        # Pin by tag, not by commit SHA: the action runs a prebuilt image named
        # after `github.action_ref` verbatim (create-docker-action.py), and
        # ghcr.io only publishes images for tags (v1.14.2, release-v1, ...).
        # A SHA pin therefore fails with `manifest unknown` — that is what
        # failed the v1.0.1 publish.
        uses: pypa/gh-action-pypi-publish@v1.14.2 # zizmor: ignore[unpinned-uses]
