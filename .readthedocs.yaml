# https://docs.readthedocs.io/page/config-file/v2.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
    nodejs: latest
  jobs:
    # Read the Docs clones shallow and without tags. hatch-vcs derives the
    # version from `git describe`, so without this the docs advertise
    # `0.1.dev1+g<sha>` instead of the released version.
    #
    # Two commands on purpose. Published history is a single commit, so the
    # `--depth 1` clone is already complete and `--unshallow` aborts with
    # "does not make sense"; combined as one command that failure would take
    # the tag fetch with it and the version would stay `0.1.dev1` even after
    # the release is tagged.
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags --force || true
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    build:
      html:
        - uv run --group doc --extra gnn --extra patch sphinx-build -M html docs docs/_build -W
        - mv docs/_build $READTHEDOCS_OUTPUT
